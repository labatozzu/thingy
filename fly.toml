# fly.toml - replace "myproject" with your Fly app name (e.g. "thingy") via: fly apps create <name> or fly launch
app = "thingylingie"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
