schema: spec-driven

# Project context (shown to AI when creating OpenSpec artifacts)
context: |
  Tech stack: Spring Boot (Java 17), Vue 3, Vite. Deploy: Docker, Fly.io.
  Auth: Session-based, CSRF protection, form login. No JWT.
  API: REST, JSON. Public: /api/hello, /api/csrf, /login, /logout. Protected: /api/**.
  Frontend: Use src/api/client.js for all API calls (handles credentials + CSRF).
  Non-goals: No forgot password, no rate limiting, generic auth errors only (no email enumeration).
  See AGENTS.md and .cursor/rules/ for full architecture and conventions.

